name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        working-directory: artifacts/umroh-app
        run: pnpm build

      - name: Install @capacitor/android di folder terpisah
        run: |
          mkdir -p /tmp/cap-deps
          cd /tmp/cap-deps
          npm init -y
          npm install @capacitor/android@8.3.4 @capacitor/core@8.3.4 --ignore-scripts
          mkdir -p $GITHUB_WORKSPACE/artifacts/umroh-app/node_modules/@capacitor
          cp -r /tmp/cap-deps/node_modules/@capacitor/android $GITHUB_WORKSPACE/artifacts/umroh-app/node_modules/@capacitor/
          cp -r /tmp/cap-deps/node_modules/@capacitor/core $GITHUB_WORKSPACE/artifacts/umroh-app/node_modules/@capacitor/

      - name: Generate Capacitor Gradle files
        run: |
          cat > artifacts/umroh-app/android/capacitor.settings.gradle << 'EOF'
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/android')
          include ':capacitor-cordova-android-plugins'
          project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')
          EOF

          cat > artifacts/umroh-app/android/app/capacitor.build.gradle << 'EOF'
          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          mkdir -p artifacts/umroh-app/android/capacitor-cordova-android-plugins/src/main
          cat > artifacts/umroh-app/android/capacitor-cordova-android-plugins/build.gradle << 'EOF'
          apply plugin: 'com.android.library'
          android {
            compileSdkVersion 35
            defaultConfig {
              minSdkVersion 23
              targetSdkVersion 35
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > artifacts/umroh-app/android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          </manifest>
          EOF

      - name: Copy web assets ke Android
        run: |
          mkdir -p artifacts/umroh-app/android/app/src/main/assets/public
          cp -r artifacts/umroh-app/dist/public/. artifacts/umroh-app/android/app/src/main/assets/public/

      - name: Build APK
        working-directory: artifacts/umroh-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umroh-mandiri-apk
          path: artifacts/umroh-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

