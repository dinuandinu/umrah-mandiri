name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        working-directory: artifacts/umroh-app
        run: pnpm build

      - name: Copy web assets ke Android
        run: |
          mkdir -p artifacts/umroh-app/android/app/src/main/assets/public
          cp -r artifacts/umroh-app/dist/public/. artifacts/umroh-app/android/app/src/main/assets/public/

      - name: Generate capacitor.settings.gradle
        run: |
          cat > artifacts/umroh-app/android/capacitor.settings.gradle << 'GRADLE'
          // Generated by CI
          GRADLE

      - name: Build APK
        working-directory: artifacts/umroh-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umroh-mandiri-apk
          path: artifacts/umroh-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
