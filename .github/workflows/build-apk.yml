name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install @capacitor/android globally
        run: |
          npm install -g @capacitor/android@8.3.4
          mkdir -p artifacts/umroh-app/node_modules/@capacitor
          cp -r $(npm root -g)/@capacitor/android artifacts/umroh-app/node_modules/@capacitor/android

      - name: Generate Capacitor Gradle files
        run: |
          cat > artifacts/umroh-app/android/capacitor.settings.gradle << 'EOF'
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/android')
          EOF

          cat > artifacts/umroh-app/android/app/capacitor.build.gradle << 'EOF'
          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

      - name: Build web app
        working-directory: artifacts/umroh-app
        run: pnpm build

      - name: Copy web assets ke Android
        run: |
          mkdir -p artifacts/umroh-app/android/app/src/main/assets/public
          cp -r artifacts/umroh-app/dist/public/. artifacts/umroh-app/android/app/src/main/assets/public/

      - name: Build APK
        working-directory: artifacts/umroh-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umroh-mandiri-apk
          path: artifacts/umroh-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
