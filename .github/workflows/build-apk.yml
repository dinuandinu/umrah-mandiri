name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Enable hoisting
        run: |
          echo "shamefully-hoist=true" >> .npmrc
          echo "node-linker=node-modules" >> .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Debug node_modules
        run: |
          echo "=== ROOT node_modules/@capacitor ==="
          ls node_modules/@capacitor/ 2>/dev/null || echo "TIDAK ADA"
          echo "=== UMROH-APP node_modules/@capacitor ==="
          ls artifacts/umroh-app/node_modules/@capacitor/ 2>/dev/null || echo "TIDAK ADA"
          echo "=== FIND @capacitor/android ==="
          find . -name "package.json" -path "*/@capacitor/android/*" | head -5

      - name: Build web app
        working-directory: artifacts/umroh-app
        run: pnpm build

