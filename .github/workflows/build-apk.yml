name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web app
        working-directory: artifacts/umroh-app
        run: pnpm build
      - name: Setup Capacitor di folder bersih
        run: |
          mkdir -p /tmp/capenv
          cd /tmp/capenv
          npm init -y
          npm install --ignore-scripts @capacitor/android@8.3.4 @capacitor/core@8.3.4 @capacitor/cli@8.3.4 typescript
      - name: Sync Capacitor
        working-directory: /tmp/capenv
        run: |
          cp $GITHUB_WORKSPACE/artifacts/umroh-app/capacitor.config.ts .
          mkdir -p dist/public
          cp -r $GITHUB_WORKSPACE/artifacts/umroh-app/dist/public/. dist/public/
          cp -r $GITHUB_WORKSPACE/artifacts/umroh-app/android .
          ./node_modules/.bin/cap sync android
          cp -r android/. $GITHUB_WORKSPACE/artifacts/umroh-app/android/
          mkdir -p $GITHUB_WORKSPACE/artifacts/umroh-app/node_modules/@capacitor
          cp -r node_modules/@capacitor/android $GITHUB_WORKSPACE/artifacts/umroh-app/node_modules/@capacitor/
          cp -r node_modules/@capacitor/core $GITHUB_WORKSPACE/artifacts/umroh-app/node_modules/@capacitor/
      - name: Build APK
        working-directory: artifacts/umroh-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: umroh-mandiri-apk
          path: artifacts/umroh-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7